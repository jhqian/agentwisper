[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "agentwisper"
version = "0.5.1"
description = "Multi-agent message broker for AI agent coordination via MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Ryan QIAN", email = "jianghao.qian@outlook.com" }]
keywords = ["multi-agent", "mcp", "message-broker", "agent-communication", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.0,<2.0",  # 2.x drops the FastMCP API and renames the client helpers
    "pydantic>=2.12",
    "click",
    "anyio",      # direct top-level import in broker/core.py (currently transitive via mcp)
    "uvicorn",    # direct lazy import in mcp_server/server.py (currently transitive via mcp)
]

[project.scripts]
agentwisper-broker = "agentwisper.cli.main:main"

[project.urls]
Homepage = "https://github.com/jhqian/agentwisper"
Repository = "https://github.com/jhqian/agentwisper"
Issues = "https://github.com/jhqian/agentwisper/issues"
Changelog = "https://github.com/jhqian/agentwisper/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agentwisper"]

[tool.hatch.build.targets.sdist]
exclude = [".agent", ".claude", ".github", "uv.lock", ".python-version"]

[project.optional-dependencies]
# (none currently; reserved)

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
