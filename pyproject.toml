[project]
name = "agentsquad"
version = "0.3.0"
description = "Multi-agent communication platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0",
    "pydantic>=2.12",
    "click",
]

[project.scripts]
agentsquad-broker = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/broker", "src/common", "src/persistence", "src/mcp_server"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
